<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Desk | Fit Core</title>
    <title>Classes Management | Fit Core Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body data-page="dashboard">


    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="container-fluid p-4 p-lg-5">
            <h1 class="fw-bold mb-1">Front Desk</h1>
            <p class="text-muted mb-4" id="todayLabel">Today's operations at a glance.</p>

            <div id="msgBanner" class="alert d-none"></div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <span class="text-uppercase text-muted small fw-bold">Classes Today</span>
                            <div class="fs-2 fw-bold" id="classesTodayValue">—</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border shadow-sm h-100 text-bg-primary">
                        <div class="card-body">
                            <i class='bx bx-user-check fs-4'></i>
                            <div class="fs-2 fw-bold" id="expectedCheckinsValue">—</div>
                            <p class="small mb-0 opacity-75">Expected check-ins today</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <span class="text-uppercase text-muted small fw-bold">Private Sessions Today</span>
                            <div class="fs-2 fw-bold" id="privateSessionsTodayValue">—</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0">Today's Classes</h6>
                                <a href="/html/Classes/classes-management.html" class="small text-decoration-none">Manage classes</a>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-sm align-middle mb-0">
                                    <thead class="table-light"><tr><th>Class</th><th>Time</th><th>Trainer</th><th>Booked</th></tr></thead>
                                    <tbody id="todayClassesBody"><tr><td colspan="4" class="text-center text-muted py-3">Loading…</td></tr></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card border shadow-sm">
                        <div class="card-body">
                            <h6 class="fw-bold mb-3">Quick Actions</h6>
                            <a href="/html/private-sessions/private-sessions.html" class="btn btn-outline-primary w-100 mb-2 text-start"><i class='bx bx-user-voice'></i> Schedule Private Session</a>
                            <a href="/html/Receptionist/reception-terminal/reception-terminal.html" class="btn btn-outline-secondary w-100 mb-2 text-start"><i class='bx bx-id-card'></i> Take Attendance</a>
                            <a href="/html/Receptionist/booking/receptionist-booking.html" class="btn btn-outline-secondary w-100 text-start"><i class='bx bx-calendar-plus'></i> Book Class For Member</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/Receptionist/Components/layout.js"></script>
    <script src="/JS/Receptionist/Dashboard/receptionist-dashboard.js"></script>
</body>
</html>
