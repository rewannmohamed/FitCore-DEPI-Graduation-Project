<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Services Management | Fit Core Admin</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/CSS/gymService/gymService.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
</head>
<body data-page="gymService">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="container-fluid p-4 p-lg-5">

            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="fw-bold mb-1">Gym Services Management</h1>
                    <p class="text-muted mb-0">Orchestrate your gallery's energy. Schedule, monitor, and optimize your studio capacity with surgical precision.</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary" id="exportPdfBtn"><i class='bx bx-download'></i> Export PDF</button>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createServiceModal">
                        <i class='bx bx-plus'></i> Deploy New Service
                    </button>
                </div>
            </div>

            <div id="msgBanner" class="alert d-none" role="alert"></div>

            <!-- Filters -->
            <div class="card shadow-sm mb-4">
                <div class="card-body row g-3 mb-md-1 mb-4">
                    <div class="col-md-8">
                        <input type="text" id="adminSearchInput" class="form-control" placeholder="Search blueprints by name...">
                    </div>
                    <div class="col-md-4">
                        <select id="adminCategoryFilter" class="form-select">
                            <option value="">All Categories</option>
                            <option value="0">Memberships</option>
                            <option value="1">Personal Training</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 ">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th style="min-width:180px;">Duration</th>
                                <th>Price</th>
                                <th>Sessions</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center bg-white">
                    <span class="text-muted small" id="paginationSummary"></span>
                    <ul class="pagination mb-0" id="paginationControls"></ul>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-3">
                <div class="col-md-3">

                    <div class="card shadow-sm mb-3 p-2">
                        <div class="row g-0 justify-content-between align-items-center ">
                            <div class="col-md-4">
                                <div class="bg-primary-subtle p-3 text-primary rounded-3 fs-3"><i class='bx bx-dumbbell'></i></div>
                            </div>
                            <div class="col-md-8">
                                <div class="card-body">
                                    <div><span class="text-muted small d-block">Tracked Services</span><h4 class="fw-bold m-0" id="adminTotalCount">0</h4></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Create Class Modal (Bootstrap) -->
    <div class="modal fade" id="createServiceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-primary fw-bold">Create & Schedule a Gym Service</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="adminBlueprintForm" class="row g-3 mb-3">
                        <input type="hidden" id="serviceIdField">
                        <div class="col-md-9">
                            <label class="form-label small fw-semibold">Service Name</label>
                            <input type="text" id="serviceName" class="form-control" required placeholder="Platinum Access Pass">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Category</label>
                            <select id="formCategory" class="form-select" required>
                                <option value="0">Memberships</option>
                                <option value="1">Personal Training</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Price (EGP)</label>
                            <input type="number" id="formPrice" step="0.01" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Allowed Sessions</label>
                            <input type="number" id="formSessions" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Duration (Days)</label>
                            <input type="number" id="formDuration" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                    <button class="btn btn-primary" id="submitCreateServiceBtn" type="button">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editServiceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-primary fw-bold">edit & Schedule a Gym Service</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3 mb-3">
                        <div class="col-md-9">
                            <label class="form-label small fw-semibold">Service Name</label>
                            <input type="text" id="editServiceName" class="form-control" required placeholder="Platinum Access Pass">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Category</label>
                            <select id="editServiceCategory" class="form-select" required>
                                <option value="0">Memberships</option>
                                <option value="1">Personal Training</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Price (EGP)</label>
                            <input type="number" id="editServicePrice" step="0.01" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Allowed Sessions</label>
                            <input type="number" id="editServiceSessions" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-muted">Duration (Days)</label>
                            <input type="number" id="editServiceDuration" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                    <button class="btn btn-primary" id="submitEditServiceBtn" type="button">edit Gym Service</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/admin/Components/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/admin/gymService/gymServices.js"></script>

</body>
</html>
