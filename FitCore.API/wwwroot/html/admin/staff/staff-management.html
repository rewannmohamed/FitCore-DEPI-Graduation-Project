<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | Fit Core Admin</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/trainers/trainers-management.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
</head>
<body data-page="staff">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page">
            <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h1>Staff</h1>
                    <p class="subtitle">Create trainer and receptionist profiles, and manage trainer working hours.</p>
                </div>
                <div class="d-flex gap-2 flex-md-row">

                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createStaffModal">
                        <i class='bx bx-plus'></i> Add New Staff
                    </button>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#trainerWorkingModal">
                        <i class="fa-regular fa-eye"></i> Staff Working Hours
                    </button>
                </div>

            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <div class="d-flex gap-2 flex-md-row mb-3">
                <div class="col-md-4 shadow-sm">
                    <select id="adminRolesFilter" class="form-select">
                        <option value="">Roles</option>
                        <option value="1">Trainer</option>
                        <option value="3">Receptionist</option>
                    </select>
                </div>
                <button class="btn btn-outline-secondary" id="exportPdfBtn"><i class='bx bx-download'></i> Export PDF</button>
            </div>


            <div class="table-container">
                <table class="table-responsive">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Specialization</th>
                            <th>Working Hours</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="trainersTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="createStaffModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-primary fw-bold">Create Trainer / Receptionist</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="adminBlueprintForm" class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="form-group"><label>Full Name</label><input type="text" id="staffFullName" class="text-input"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group"><label>Email</label><input type="email" id="staffEmail" class="text-input"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group"><label>Phone</label><input type="text" id="staffPhone" class="text-input"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group"><label>Password</label><input type="password" id="staffPassword" class="text-input"></div>
                        </div>
                        <div class="col-md-4">
                            <label>Role</label>
                            <select id="staffRole" class="form-select">
                                <option value="1">Trainer</option>
                                <option value="3">Receptionist</option>
                            </select>
                        </div>
                        <div class="form-grid" id="trainerOnlyFields">
                            <div class="form-group"><label>Specialization</label><input type="text" id="staffSpecialization" class="text-input"></div>
                            <div class="form-group"><label>Bio</label><input type="text" id="staffBio" class="text-input"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                    <button class="btn-primary" id="createStaffBtn">Create Profile</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="trainerWorkingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-primary fw-bold">Trainer Working Hours</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="adminBlueprintForm" class="row g-3 mb-3">
                        <div class="col-md-6 form-group" style="margin-bottom: var(--space-4);">
                            <label>Trainer</label>
                            <select id="workingHoursTrainerSelect"></select>
                        </div>
                        <div id="workingHoursRows"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn-outline" id="addWorkingHourRowBtn">+ Add Time Slot</button>
                    <button class="btn-primary" id="saveWorkingHoursBtn">Save Working Hours</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/JS/admin/Components/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/admin/Components/layout.js"></script>
    <script src="/JS/admin/Trainers/trainers.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
</body>
</html>
