<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail Logs | Fit Core</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/AuditLogs/auditlogs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
</head>
<body data-page="reports">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <span class="badge">SYSTEM INTEGRITY</span>
                    <h1>Audit Trail Logs</h1>
                    <p class="subtitle">Monitor platform-wide activity with high-fidelity logging...</p>
                </div>
            </div>

            <div class="filters-bar">
                <input type="text" id="searchInput" placeholder="Search logs, modules, or staff..." class="search-input">

                <select id="sortBySelect" class="filter-select">
                    <option value="Date">Sort by Date</option>
                    <option value="Action">Sort by Action</option>
                    <option value="Entity">Sort by Module</option>
                    <option value="User">Sort by User</option>
                </select>

                <button id="sortDirBtn" class="btn-outline">⬇ Desc</button>
                <button id="applyBtn" class="btn-primary">Apply Filters</button>
            </div>

            <div class="table-container">

                <div class="table-responsive">
                    <table id="auditTable">
                        <thead>
                            <tr>
                                <th>TIMESTAMP</th>
                                <th>USER / IDENTITY</th>
                                <th>ACTION & PAYLOAD</th>
                                <th>MODULE</th>
                                <th>DETAILS</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="paginationControls">
                </div>
            </div>
        </div>
    </main>
    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/admin/Components/layout.js"></script>
    <script src="/JS/admin/AuditLogs/auditlogs.js"></script>
</body>
</html>
