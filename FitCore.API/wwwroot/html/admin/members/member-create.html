<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Member | Fit Core</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/members/management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
</head>
<body data-page="members">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <span class="badge">FRONT DESK</span>
                    <h1>Create Member Account</h1>
                    <p class="subtitle">Fill in the visitor's details to start their FitCore membership.</p>
                </div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <div class="card" style="max-width: 640px;">
                <h2>Member Details</h2>

                <form id="memberForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="fullName" class="text-input" placeholder="Johnathan Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="email" class="text-input" placeholder="john@fitcore.com" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="phoneNumber" class="text-input" placeholder="+1 (555) 000-0000" required>
                        </div>
                        <div class="form-group">
                            <label>Temporary Password</label>
                            <input type="password" id="password" class="text-input" placeholder="At least 6 characters" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-100" id="createBtn" style="margin-top: 8px;">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="/JS/Auth/auth-common.js"></script>
    <<script src="/JS/admin/Components/layout.js"></script>
    <script src="/JS/Auth/member-create.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
</body>
</html>
