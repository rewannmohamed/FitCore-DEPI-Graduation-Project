<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes | Fit Core</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Classes/classes-schedule.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
</head>
<body data-page="classes">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page">
            <div class="page-intro">
                <span class="eyebrow">Weekly Schedule</span>
                <h1>Collective Energies</h1>
                <p>Discover your next breakthrough. Filter our curated classes by intensity, discipline, or master instructor.</p>
            </div>

            <div class="discipline-pills" id="disciplinePills">
                <button class="pill active" data-filter="">All Classes</button>
            </div>

            <div class="toolbar">
                <div class="dropdown">
                    <i class='bx bx-slider-alt'></i>
                    <select id="trainerFilter"><option value="">Filter by Trainer</option></select>
                </div>
                <div class="dropdown">
                    <i class='bx bx-calendar'></i>
                    <select id="rangeFilter">
                        <option value="7">This Week</option>
                        <option value="14">Next 2 Weeks</option>
                        <option value="30">This Month</option>
                    </select>
                </div>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid"><i class='bx bx-grid-alt'></i></button>
                    <button class="view-btn" data-view="list"><i class='bx bx-list-ul'></i></button>
                </div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <section class="classes-grid" id="classesGrid"></section>

            <div class="load-more-wrap">
                <button class="btn-outline" id="loadMoreBtn" style="display:none;">Load More Classes <i class='bx bx-chevron-down'></i></button>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/user/Components/layout.js"></script>
    <script src="/JS/user/Classes/class-schedule.js"></script>
</body>
</html>
