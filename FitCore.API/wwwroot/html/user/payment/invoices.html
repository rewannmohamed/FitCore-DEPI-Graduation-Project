<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Invoices | FitCore</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/payment/Invoices.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="invoices">
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="header-container"></div>

        <div class="container p-block">
            <div class="page-header">
                <h2><i class="fa-solid fa-file-invoice-dollar primary-blue"></i> My Invoices</h2>
            </div>

            <div class="table-wrapper">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Invoice #</th>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading invoices...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-controls">
                <button class="btn-outline" id="prevPageBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
                <span id="pageIndicator" class="text-muted">Page 1</span>
                <button class="btn-outline" id="nextPageBtn">Next <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/user/Components/layout.js"></script>
    <script src="/JS/user/payment/invoices.js"></script>
</body>
</html>
