<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCore - Gym Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/CSS/style.css" rel="stylesheet">
    <link href="/CSS/gymService/gymServiceUser.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-page="GymServices">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page p-5">

            <div class="d-flex flex-sm-row flex-column gap-2 p-sm-0 p-5 justify-content-between align-items-center mb-5">
                <div class="position-relative" style="min-width: 300px;">
                    <i class='bx bx-search position-absolute text-muted fs-5' style="left: 14px; top: 50%; transform: translateY(-50%);"></i>
                    <input type="text" id="userSearchInput" class="form-control rounded-pill ps-5 py-2" placeholder="Search available plans...">
                </div>
                <select id="userCategoryFilter" class="form-select rounded-3" style="width: 220px;">
                    <option value="">All Categories</option>
                    <option value="0">Memberships</option>
                    <option value="1">Personal Training</option>
                    <option value="2">Spa & Recovery</option>
                    <option value="3">Special Workshops</option>
                </select>
            </div>

            <div class="mb-5">
                <span class="text-uppercase fw-bold text-primary small tracking-wider">Premium Tier Access</span>
                <h1 class="fw-extrabold tracking-tight mt-1">The FitCore Gym Services </h1>
                <p class="text-muted">Choose your gateway to elite performance, crafted for high-achievers.</p>
            </div>

            <div class="row row-cols-md-2 row-cols-1 row-cols-lg-5 g-4" id="userCardsContainer">
            </div>

            <div class="d-flex justify-content-between align-items-center mt-5 pt-4 border-top">
                <span class="text-muted small" id="userPaginationText">Showing 0 tiers</span>
                <div class="btn-group">
                    <button class="btn btn-outline-secondary btn-sm px-3" id="userBtnPrev" disabled><i class='bx bx-chevron-left'></i></button>
                    <button class="btn btn-outline-secondary btn-sm px-3" id="userBtnNext" disabled><i class='bx bx-chevron-right'></i></button>
                </div>
            </div>

        </div>
    </main>
    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/user/Components/layout.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/user/gymServices/gymService.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
