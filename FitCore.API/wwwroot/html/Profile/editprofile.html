<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Fit Core</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Profile/editprofile.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body data-page="profile">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page-content">
            <div class="page-header">
                <button class="back-btn" id="goBackBtn">
                    <i class="fa-solid fa-arrow-left"></i> Back to Profile
                </button>
                <h1>Edit Profile</h1>
                <p class="subtitle">Update your personal information and settings.</p>
            </div>

            <div class="card form-container">
                <form id="editProfileForm">
                    <h3 class="section-title">Basic Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="phoneNumber">Phone Number</label>
                            <input type="tel" id="phoneNumber" class="form-control" required>
                        </div>
                    </div>

                    <div id="trainerSection" class="trainer-section hidden">
                        <h3 class="section-title">Trainer Information</h3>
                        <div class="form-group">
                            <label for="specialization">Specialization</label>
                            <input type="text" id="specialization" class="form-control" placeholder="e.g., Crossfit, Weightlifting">
                        </div>
                        <div class="form-group">
                            <label for="workingHours">Working Hours</label>
                            <input type="text" id="workingHours" class="form-control" placeholder="e.g., 09:00 AM - 05:00 PM">
                        </div>
                        <div class="form-group">
                            <label for="bio">Bio</label>
                            <textarea id="bio" class="form-control" rows="3" placeholder="Tell members about your experience..."></textarea>
                        </div>
                    </div>

                    <div id="errorContainer" class="error-alert hidden"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary w-100" id="saveBtn">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="/JS/Auth/auth-common.js"></script>
    <!--<script src="/js/admin/Components/layout.js"></script>-->
    <script src="/JS/Profile/editprofile.js"></script>

</body>
</html>
