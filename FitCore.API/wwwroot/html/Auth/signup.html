<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Sign Up | FitCore</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Auth/signup.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-mark">FC</div>
                <h2>Join FitCore</h2>
                <p>Create your member account to start your fitness journey.</p>
            </div>

            <div id="errorMessage" class="error-alert hidden"></div>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
                </div>

                <button type="submit" id="submitBtn" class="btn-primary w-100">
                    <span id="btnText">Create Account</span>
                    <span id="btnSpinner" class="spinner hidden"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/html/Auth/login.html" class="primary-blue-soft-text">Log in here</a></p>
            </div>
        </div>
    </div>

    <script src="/JS/Auth/signup.js"></script>
</body>
</html>
