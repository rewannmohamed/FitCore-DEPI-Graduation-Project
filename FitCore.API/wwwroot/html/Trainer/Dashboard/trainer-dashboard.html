<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Fit Core Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body data-page="Dashboard">


    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="container-fluid p-4 p-lg-5">
            <h1 class="fw-bold mb-1" id="greetingText">Welcome back.</h1>
            <p class="text-muted mb-4">Here's what your week looks like.</p>

            <div id="msgBanner" class="alert d-none"></div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <span class="text-uppercase text-muted small fw-bold">Assigned Classes</span>
                            <div class="fs-2 fw-bold" id="assignedClassesValue">—</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <span class="text-uppercase text-muted small fw-bold">Sessions This Week</span>
                            <div class="fs-2 fw-bold" id="sessionsThisWeekValue">—</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <span class="text-uppercase text-muted small fw-bold">Students Booked</span>
                            <div class="fs-2 fw-bold" id="studentsBookedValue">—</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border shadow-sm h-100 text-bg-primary">
                        <div class="card-body">
                            <i class='bx bx-user-voice fs-4'></i>
                            <div class="fs-2 fw-bold" id="upcomingPrivateSessionsValue">—</div>
                            <p class="small mb-0 opacity-75">Upcoming private sessions</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0">My Classes</h6>
                                <a href="/html/Trainer/trainer-classes.html" class="small text-decoration-none">View all</a>
                            </div>
                            <div id="classesList"><div class="text-muted small">Loading…</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card border shadow-sm h-100">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0">Upcoming Private Sessions</h6>
                                <a href="/html/Trainer/private-sessions/private-sessions.html" class="small text-decoration-none">View all</a>
                            </div>
                            <div id="privateSessionsList"><div class="text-muted small">Loading…</div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/Trainer/Components/layout.js"></script>
    <script src="/JS/Trainer/Dashboard/trainer-dashboard.js"></script>
</body>
</html>
