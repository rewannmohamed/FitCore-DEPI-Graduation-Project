<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Hours | Fit Core Trainer</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/trainers/workingHours.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body data-page="WorkingHours">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page">
            <div class="page-header">
                <h1>Working Hours</h1>
                <p class="subtitle">Define the days and times you're available to teach classes or take private sessions.</p>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <div class="card shadow-sm">
                <div id="hoursRows"></div>
                <button class="btn-outline btn-sm" id="addRowBtn">+ Add Time Slot</button>
                <div class="card-actions">
                    <button class="btn-primary" id="saveBtn">Save Working Hours</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/JS/admin/Components/api.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/Trainer/Components/layout.js"></script>
    <script src="/JS/Trainer/workingHours/workingHours.js"></script>
</body>
</html>
