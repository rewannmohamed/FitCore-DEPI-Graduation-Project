<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes | Fit Core Trainer</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/Classes/trainerClasses.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body data-page="MyClasses">

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="header-container"></div>

        <div class="page">
            <div class="page-header">
                <div>
                    <h1>My Classes</h1>
                    <p class="subtitle">Every class you're currently assigned to, with this week's attendance at a glance.</p>
                </div>
            </div>

            <div id="msgBanner" class="msg-banner"></div>

            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-label">ASSIGNED CLASSES</span>
                    <div class="stat-value" id="assignedClassesValue">—</div>
                </div>
                <div class="stat-card">
                    <span class="stat-label">SESSIONS THIS WEEK</span>
                    <div class="stat-value" id="sessionsThisWeekValue">—</div>
                </div>
                <div class="stat-card">
                    <span class="stat-label">STUDENTS BOOKED THIS WEEK</span>
                    <div class="stat-value" id="studentsBookedValue">—</div>
                </div>
            </div>

            <div class="cards-grid" id="classesGrid"></div>
        </div>
    </main>

    <script src="/JS/admin/Components/api.js"></script>
    <script>
        window.FITCORE_LAYOUT_CONFIG = {
            sidebar: 'trainer',
            header: 'simple',
            activeNav: 'MyClasses',
            user: { name: 'Marcus Thorne', role: 'Trainer', initials: 'MT' }
        };
        // TODO: replace with the authenticated trainer's TrainerID once auth is wired in.
        window.CURRENT_TRAINER_ID = 1;
    </script>
    <script src="/JS/Trainer/Components/layout.js"></script>
    <script src="/JS/Auth/auth-common.js"></script>
    <script src="/JS/Trainer/trainerClasses/trainerClasses.js"></script>
</body>
</html>
